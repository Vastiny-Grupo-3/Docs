<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>
.txt{font-family:'Segoe UI',Arial,sans-serif;fill:#252321}.muted{fill:#77736f}.line{stroke:#34312f;stroke-width:2}.thin{stroke:#aaa39d;stroke-width:1.5}.card{fill:#fffdfa;stroke:#77716b;stroke-width:1.5}.btn{fill:#fffdfa;stroke:#4a4642;stroke-width:1.5}.accent{fill:#d6beb3}.danger{fill:#fff8f6;stroke:#bd665b;stroke-width:1.5}
</style></defs>
<rect width="1600" height="1000" fill="#f4f1ee"/>
<rect x="28" y="28" width="1544" height="944" rx="24" fill="#fff" stroke="#302d2b" stroke-width="2.5"/>
<!-- nav --> <rect x="42" y="42" width="258" height="916" rx="20" fill="#f8f7f5" stroke="#393532" stroke-width="2"/>
<text class="txt" x="171" y="91" text-anchor="middle" font-size="21">Bem-vindo!</text><path class="line" d="M88 104h166"/><text class="txt" x="171" y="137" text-anchor="middle" font-size="20">Cleber</text><path class="line" d="M88 149h166"/>
<g font-family="Segoe UI,Arial" font-size="22" text-anchor="middle" fill="#292624"><rect class="btn" x="67" y="193" width="208" height="54" rx="13"/><text x="171" y="228">Catálogo</text><rect class="btn" x="67" y="264" width="208" height="54" rx="13"/><text x="171" y="299">Clientes</text><rect class="btn" x="67" y="335" width="208" height="54" rx="13"/><text x="171" y="370">Histórico</text></g>
<text class="txt" x="171" y="432" text-anchor="middle" font-size="21">Operações</text><g font-family="Segoe UI,Arial" font-size="21" text-anchor="middle" fill="#292624"><rect class="btn" x="82" y="449" width="178" height="48" rx="12"/><text x="171" y="480">Entrada</text><rect class="btn" x="82" y="510" width="178" height="48" rx="12"/><text x="171" y="541">Saída</text><rect class="btn" x="67" y="582" width="208" height="54" rx="13"/><text x="171" y="617">Dashboard</text><rect class="accent" x="67" y="652" width="208" height="54" rx="13" stroke="#393532" stroke-width="1.5"/><text x="171" y="687">Configurações</text><rect class="btn" x="82" y="877" width="178" height="50" rx="12"/><text x="171" y="909">Sair</text></g>
<!-- content -->
<text class="txt" x="345" y="103" font-size="43" font-weight="600">Configurações</text><text class="muted" x="347" y="137" font-size="17">Gerencie seus dados de acesso e as categorias dos produtos.</text>
<!-- account card -->
<rect class="card" x="340" y="162" width="1215" height="300" rx="18"/><text class="txt" x="374" y="204" font-size="27" font-weight="600">Dados da conta</text><text class="muted" x="374" y="231" font-size="16">Atualize suas informações pessoais e credenciais.</text>
<text class="txt" x="376" y="270" font-size="17">Nome de usuário</text><rect x="374" y="281" width="545" height="48" rx="9" fill="#fff" stroke="#aaa39d"/><text class="txt" x="392" y="312" font-size="17">Cleber</text>
<text class="txt" x="950" y="270" font-size="17">E-mail da conta</text><rect x="948" y="281" width="565" height="48" rx="9" fill="#fff" stroke="#aaa39d"/><text class="txt" x="966" y="312" font-size="17">cleber@email.com</text>
<text class="txt" x="376" y="365" font-size="17">Senha atual</text><rect x="374" y="376" width="350" height="46" rx="9" fill="#fff" stroke="#aaa39d"/><text class="muted" x="392" y="406" font-size="17">••••••••</text>
<text class="txt" x="746" y="365" font-size="17">Nova senha</text><rect x="744" y="376" width="350" height="46" rx="9" fill="#fff" stroke="#aaa39d"/><text class="muted" x="762" y="406" font-size="17">Digite a nova senha</text>
<rect x="1291" y="389" width="222" height="48" rx="11" fill="#d6beb3" stroke="#514943" stroke-width="1.5"/><text class="txt" x="1402" y="420" text-anchor="middle" font-size="18" font-weight="600">Salvar alterações</text>
<!-- categories -->
<rect class="card" x="340" y="483" width="1215" height="338" rx="18"/><text class="txt" x="374" y="527" font-size="27" font-weight="600">Categorias de produtos</text><text class="muted" x="374" y="554" font-size="16">Cadastre e mantenha as categorias usadas no catálogo.</text>
<rect class="btn" x="1278" y="505" width="235" height="46" rx="11"/><text class="txt" x="1395" y="535" text-anchor="middle" font-size="17">+ Nova categoria</text>
<rect x="374" y="579" width="1138" height="42" rx="8" fill="#eee7e2"/><text class="txt" x="400" y="606" font-size="16" font-weight="600">Categoria</text><text class="txt" x="1170" y="606" font-size="16" font-weight="600">Produtos associados</text><text class="txt" x="1430" y="606" font-size="16" font-weight="600">Ações</text>
<g class="txt" font-size="17"><rect x="374" y="628" width="1138" height="48" rx="8" fill="#fff" stroke="#ddd6d0"/><text x="400" y="659">Buzina</text><text x="1245" y="659">12</text><text x="1406" y="659">✎</text><text x="1460" y="659" fill="#b34d42">⌫</text><rect x="374" y="683" width="1138" height="48" rx="8" fill="#fff" stroke="#ddd6d0"/><text x="400" y="714">Chicotes</text><text x="1245" y="714">8</text><text x="1406" y="714">✎</text><text x="1460" y="714" fill="#b34d42">⌫</text><rect x="374" y="738" width="1138" height="48" rx="8" fill="#fff" stroke="#ddd6d0"/><text x="400" y="769">Acessórios</text><text x="1245" y="769">5</text><text x="1406" y="769">✎</text><text x="1460" y="769" fill="#b34d42">⌫</text></g>
<!-- account actions -->
<rect class="danger" x="340" y="842" width="1215" height="99" rx="16"/><text class="txt" x="374" y="881" font-size="22" font-weight="600">Ações da conta</text><text class="muted" x="374" y="910" font-size="15">Sair encerra sua sessão. Excluir conta remove seu acesso e seus dados.</text><rect class="btn" x="1150" y="866" width="150" height="48" rx="10"/><text class="txt" x="1225" y="896" text-anchor="middle" font-size="17">Sair da conta</text><rect x="1320" y="866" width="193" height="48" rx="10" fill="#b95146" stroke="#923b33" stroke-width="1.5"/><text x="1416" y="896" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#fff">Excluir conta</text>
</svg>
